server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/micro_order?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    port: 6379
    host: localhost
  authentication:
    accessToken:
      expiresMinute: 500000000
    refreshToken:
      expiresMinute: 500000000
    forgotPassword:
      codeExpiredMinutes: 5




