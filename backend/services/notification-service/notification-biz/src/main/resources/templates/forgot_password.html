<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="card-title mb-4">Forgot Password</h2>

            <ul class="list-group mb-4">
                <li class="list-group-item"><strong>Email:</strong> <span th:text="${email}">John Doe</span></li>
                <li class="list-group-item"><strong>Full Name:</strong> <span th:text="${fullName}">John Doe</span></li>
                <li class="list-group-item"><strong>Forgot Code:</strong> <span th:text="${forgotCode}">123456</span></li>
                <li class="list-group-item"><strong>Joined:</strong> <span th:text="${joined}">2023-01-01</span></li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
