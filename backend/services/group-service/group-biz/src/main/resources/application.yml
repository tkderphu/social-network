server:
  port: 8082

spring:
  application:
    name: group-service
  datasource:
    url: jdbc:mysql://localhost:3306/social_network_group_service?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
